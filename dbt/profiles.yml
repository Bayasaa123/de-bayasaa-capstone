dbt_lake:
  target: dev
  outputs:
    dev:
      type: athena
      region_name: ap-southeast-2
      work_group: primary
      database: AwsDataCatalog
      schema: raw
      s3_staging_dir: s3://data-lake-dev-bayasaa/athena/staging/
      s3_data_dir:    s3://data-lake-dev-bayasaa/raw/
      threads: 5